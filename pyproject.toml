[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(^|/)(venv|setup_proyecto\\.py|verificar_entorno\\.py)(/|$)"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "setup_proyecto.py", "verificar_entorno.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
